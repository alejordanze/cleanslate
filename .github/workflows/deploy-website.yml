name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
  pull_request:
    paths:
      - website/**

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check Firebase configuration
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLEANSLATE_74AF5 }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::Set the FIREBASE_SERVICE_ACCOUNT_CLEANSLATE_74AF5 repository secret."
            exit 1
          fi
      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLEANSLATE_74AF5 }}
          projectId: cleanslate-74af5
          channelId: live
          entryPoint: website
