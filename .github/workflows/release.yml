name: Release macOS DMGs

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) { console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${p.version}`); process.exit(1) }'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build unsigned DMG
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Mount and launch packaged app
        run: |
          dmg_files=(release/*.dmg)
          test "${#dmg_files[@]}" -eq 1
          scripts/smoke-dmg.sh "${dmg_files[0]}"
      - name: Create checksum
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - name: Verify both downloads
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          sha256sum -c SHA256SUMS-arm64.txt
          sha256sum -c SHA256SUMS-x64.txt
      - name: Publish GitHub release
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "CleanSlate $RELEASE_TAG" --notes-file .github/release-notes.md
