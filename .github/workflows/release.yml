name: Release macOS DMGs

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare release tag
        id: release
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Run this workflow from $DEFAULT_BRANCH."
              exit 1
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump package.json for the next release."
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              git fetch --no-tags origin "refs/tags/$tag"
              tagged_commit=$(git rev-list -n 1 FETCH_HEAD)
              if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
                echo "::error::Tag $tag points to $tagged_commit, not this commit $GITHUB_SHA."
                exit 1
              fi
              echo "Reusing $tag after an earlier failed release run."
            else
              status=$?
              if [[ "$status" -ne 2 ]]; then
                exit "$status"
              fi
              git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$tag" -m "CleanSlate $tag"
              git push origin "refs/tags/$tag"
            fi
          elif [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) { console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${p.version}`); process.exit(1) }'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build unsigned DMG
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Mount and launch packaged app
        run: |
          dmg_files=(release/*.dmg)
          test "${#dmg_files[@]}" -eq 1
          scripts/smoke-dmg.sh "${dmg_files[0]}"
      - name: Create checksum
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS-${{ matrix.arch }}.txt
      - name: Attest DMG build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@v4
        with:
          subject-path: release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - name: Verify both downloads
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          sha256sum -c SHA256SUMS-arm64.txt
          sha256sum -c SHA256SUMS-x64.txt
      - name: Verify DMG build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        run: |
          for dmg in dist/*.dmg; do
            gh attestation verify "$dmg" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Publish GitHub release
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "CleanSlate $RELEASE_TAG" --notes-file .github/release-notes.md
